name: Publish Parliant v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-parliant-v1-once.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: v1.0.0
      ARCHIVE_NAME: parliant-v1.0.0-linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize clean release commit
        id: finalize
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-parliant-v1-once.yml
          git commit -m "chore: finalize Parliant v1.0.0 release tree"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install native development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgtk-layer-shell-dev

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binaries
        run: cargo build --workspace --release --locked

      - name: Package Linux x86_64 release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${ARCHIVE_NAME}/docs"
          cp target/release/parliant "dist/${ARCHIVE_NAME}/"
          cp target/release/parliant-overlay "dist/${ARCHIVE_NAME}/"
          cp README.md SECURITY.md "dist/${ARCHIVE_NAME}/"
          cp docs/INSTALL.md docs/PRIVACY.md docs/REMOTE_MCP.md "dist/${ARCHIVE_NAME}/docs/"
          tar -C dist -czf "dist/${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          (cd dist && sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.finalize.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parliant-v1-notes.md <<'EOF'
          # Parliant v1.0.0

          *Intelligence beside you.*

          Parliant V1 is the first complete Linux-first release of the local meeting-intelligence stack.

          ## Included

          - explicit PipeWire source / sink-monitor capture with no silent fallback
          - streaming transcription through a provider boundary
          - bounded finalized meeting state kept in memory by default
          - likely-question detection with manual-trigger support
          - event-driven suggested answers through the OpenAI Responses API boundary
          - private Wayland/GTK layer-shell overlay
          - bounded read-only local MCP meeting context
          - optional authenticated loopback remote MCP bridge for cloud clients
          - same-UID local IPC, bounded queues/backpressure, reconnect behavior, cancellation and degraded states
          - privacy defaults that do not persist raw audio or transcripts by default

          ## Verification

          The release candidate passed the repository release gate: Rust formatting, warnings-denied Clippy, deterministic workspace tests, tracked-file secret scanning, and a locked release build.

          Hardware-, compositor-, credential-, and public-tunnel-dependent checks are intentionally not represented as completed CI evidence. Real PipeWire capture, live OpenAI transcription/answer generation, real Wayland overlay behavior, and ChatGPT/Secure-MCP-Tunnel end-to-end verification remain owner-side runtime smoke checks documented in `docs/INSTALL.md` and `docs/REMOTE_MCP.md`.

          ## Linux archive

          The attached x86_64 archive contains `parliant`, `parliant-overlay`, and the V1 install/privacy/remote-MCP documentation. Runtime PipeWire, GTK3 and gtk-layer-shell libraries are still required on the host.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "$RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            "dist/${ARCHIVE_NAME}.tar.gz" \
            "dist/${ARCHIVE_NAME}.tar.gz.sha256" \
            --target "$RELEASE_SHA" \
            --title "Parliant v1.0.0" \
            --notes-file /tmp/parliant-v1-notes.md \
            --latest

      - name: Delete merged implementation branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            chore/pre-implementation-architecture
            chore/parliant-rename-runner
            chore/rename-parliant
            chore/v1-release-finalize
            feat/m1-pipewire-capture
            feat/m2-streaming-transcription
            feat/m3-live-meeting-state
            feat/m4-question-detection
            feat/m5-meeting-mcp
            feat/m6-answer-orchestrator
            feat/m7-private-overlay
            feat/m8-remote-mcp-bridge
            feat/m9-v1-hardening
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done

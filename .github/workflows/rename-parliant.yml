name: Rename project to Parliant

on:
  push:
    branches:
      - chore/rename-parliant
  pull_request:
    branches:
      - feat/m9-v1-hardening

permissions:
  contents: write

jobs:
  rename:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, 'chore: rename project to Parliant') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-parliant
          fetch-depth: 0

      - name: Rename project tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path('.')
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = [Path(path) for path in tracked if path]

          replacements = (
              ('SIDECAR', 'PARLIANT'),
              ('Sidecar', 'Parliant'),
              ('sidecar', 'parliant'),
          )

          for path in tracked:
              if not path.is_file():
                  continue
              try:
                  data = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = data
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != data:
                  path.write_text(updated, encoding='utf-8')

          paths = [path for path in root.rglob('*') if '.git' not in path.parts]
          for path in sorted(paths, key=lambda item: len(item.parts), reverse=True):
              if 'sidecar' not in path.name:
                  continue
              target = path.with_name(path.name.replace('sidecar', 'parliant'))
              path.rename(target)

          helper = Path('.github/workflows/rename-parliant.yml')
          if helper.exists():
              helper.unlink()
          PY

          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: rename project to Parliant"
          git push origin HEAD:chore/rename-parliant

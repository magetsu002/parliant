name: Temporary live-test hotfix trigger

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/chatgpt-mcp-live-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-mcp-live-test
          fetch-depth: 0

      - name: Install native development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libgtk-3-dev libgtk-layer-shell-dev

      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Apply and validate focused hotfix
        shell: bash
        run: |
          git fetch origin chore/live-hotfix-runner
          git show origin/chore/live-hotfix-runner:scripts/apply-live-hotfix.py > /tmp/apply-live-hotfix.py
          python3 /tmp/apply-live-hotfix.py

          rm -f .hotfix-trigger
          cargo fmt --all
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python3 scripts/secret-scan.py
          git diff --check

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align live ChatGPT MCP integration"
          git push origin HEAD:fix/chatgpt-mcp-live-test

      - name: Remove temporary trigger from main
        if: success()
        shell: bash
        run: |
          git fetch origin main
          git checkout -B temp-main-cleanup origin/main
          git rm .github/workflows/temp-live-hotfix-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary live-test runner"
          git push origin HEAD:main

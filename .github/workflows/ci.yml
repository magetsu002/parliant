name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m9-v1-hardening
      - name: Install native development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgtk-layer-shell-dev
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Generate and commit dependency lockfile
        if: github.event_name == 'pull_request'
        run: |
          cargo generate-lockfile
          if ! git diff --quiet -- Cargo.lock || ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'build(m9): lock V1 dependencies'
            git push origin HEAD:feat/m9-v1-hardening
          fi
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

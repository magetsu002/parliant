name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgtk-layer-shell-dev
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply formatting for repair artifact
        run: cargo fmt --all
      - name: Upload formatted M8 source
        uses: actions/upload-artifact@v4
        with:
          name: m8-rustfmt-source
          path: crates/sidecar-remote-mcp/src/lib.rs
          if-no-files-found: error
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

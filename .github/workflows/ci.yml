name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m8-remote-mcp-bridge
      - name: Install native development headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgtk-layer-shell-dev
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Apply and commit HTTP parser ownership repair
        if: github.event_name == 'pull_request'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/sidecar-remote-mcp/src/lib.rs')
          text = path.read_text()
          old = '''    let header_text = std::str::from_utf8(&buffer[..header_end - 4])
              .map_err(|_| HttpFailure::bad_request("HTTP headers must be UTF-8/ASCII"))?;
          '''
          new = '''    let header_text = std::str::from_utf8(&buffer[..header_end - 4])
              .map_err(|_| HttpFailure::bad_request("HTTP headers must be UTF-8/ASCII"))?
              .to_owned();
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif '.map_err(|_| HttpFailure::bad_request("HTTP headers must be UTF-8/ASCII"))?\n        .to_owned();' not in text:
              raise SystemExit('expected parser block not found')
          PY
          cargo fmt --all
          if ! git diff --quiet -- crates/sidecar-remote-mcp/src/lib.rs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/sidecar-remote-mcp/src/lib.rs
            git commit -m 'fix(m8): own parsed HTTP headers before body reads'
            git push origin HEAD:feat/m8-remote-mcp-bridge
          fi
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

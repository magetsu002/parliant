name: Architecture discussion
description: Propose a change to SIDECAR's public architecture before implementation.
title: "[architecture] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete problem requires an architecture change?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest architecture change that solves it.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs
      description: What becomes better, worse, or more complex?
    validations:
      required: true

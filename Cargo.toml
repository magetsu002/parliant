[workspace]
members = [
    "crates/sidecar-core",
    "crates/sidecar-audio",
    "crates/sidecar-transcribe",
    "crates/sidecar-context",
    "crates/sidecar-detect",
    "crates/sidecar-mcp",
    "crates/sidecar-orchestrator",
    "crates/sidecar-ipc",
    "crates/sidecar-remote-mcp",
    "crates/sidecar-daemon",
    "apps/sidecar-overlay",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/magetsu002/sidecar"
publish = false

[workspace.dependencies]
sidecar-core = { path = "crates/sidecar-core" }
sidecar-audio = { path = "crates/sidecar-audio" }
sidecar-transcribe = { path = "crates/sidecar-transcribe" }
sidecar-context = { path = "crates/sidecar-context" }
sidecar-detect = { path = "crates/sidecar-detect" }
sidecar-mcp = { path = "crates/sidecar-mcp" }
sidecar-orchestrator = { path = "crates/sidecar-orchestrator" }
sidecar-ipc = { path = "crates/sidecar-ipc" }
sidecar-remote-mcp = { path = "crates/sidecar-remote-mcp" }
thiserror = "2.0"
signal-hook = "0.3.18"
clap = { version = "4.5", features = ["derive"] }
pipewire = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libc = "0.2"
gtk = "0.18.2"
gdk = "0.18.2"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
